:root {

  --border: #D8DAE0; --edge: #FFFFFF;

  --rest: #7B78E0; --lav: #8E949E;
  --st-awake: #8E949E; --st-light: #7B78E0; --st-deep: #C13EC1; --st-rem: #8E3BD6;
  --r0: #C0392B; --r30: #D9682A; --r55: #C99A00; --r78: #6FB23A; --r100: #0F9D62;
  --s0: #7E460E; --s33: #A4621B; --s66: #C2792E; --s100: #D89240;

  --shadow: 0 1px 2px rgba(23,24,28,.06), 0 8px 24px rgba(23,24,28,.06);
  --knob-hi: #FFFFFF; --knob-lo: #DCDEE4;

  --f-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

} }

  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.28);

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--text); font-family: var(--f-ui); font-size: 15px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.over { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }

/* Shell */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px;
  padding: 22px 12px 14px; border-right: 1px solid var(--border); background: var(--canvas); }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 18px; font-weight: 700; font-size: 19px; letter-spacing: .02em; }
.brand svg { width: 22px; height: 22px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: none; border-radius: 9px;
  color: var(--text-2); text-align: left; cursor: pointer; font-size: 14.5px; text-decoration: none; }
.nav-item svg { width: 17px; height: 17px; color: var(--text-3); }
.nav-item:hover { background: var(--inset); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.nav-item[aria-current="page"] svg { color: var(--mint); }
.side-foot { margin-top: auto; }
.status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); flex: none; }
.status.stale .dot { background: var(--warn); box-shadow: none; }
.status b { display: block; font-size: 13px; font-weight: 600; }
.status span { font-size: 12px; color: var(--text-3); }
.main { min-width: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 34px 60px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
.tabbar { display: none; }

/* Header */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.head .sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.daynav { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg { width: 15px; height: 15px; }
.batt { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; color: var(--text-2); }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; color: var(--text-2); line-height: 1.45; }
.banner b { color: var(--text); }
.banner svg { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--mint); }

/* Cards */
.card { background: linear-gradient(180deg, var(--surface-top), var(--surface)); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 600; }

/* Hero dials */
.hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 22px 12px 16px; position: relative; }
.src { position: absolute; top: -11px; right: 44px; font-size: 10px; font-weight: 700; letter-spacing: .14em; padding: 4px 9px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--inset); color: var(--text-2); }
.dial { display: flex; flex-direction: column; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 0; }
.dial svg { width: min(118px, 26vw); height: auto; display: block; }
.dial .lab { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--text-2); }
.dial:hover .lab { color: var(--text); }

.greet { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.greet h2 { margin: 0; font-size: 20px; font-weight: 700; }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12px; font-weight: 600;
  border: 1px solid currentColor; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.synth p { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.synth p + p { margin-top: 6px; font-weight: 400; font-size: 13.5px; color: var(--text-2); }

.metrics-h { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px 16px; }
.tile .t-l { display: flex; align-items: center; gap: 7px; }
.tile .t-l svg { width: 14px; height: 14px; }
.tile .t-v { font-size: 26px; font-weight: 700; margin: 8px 0 12px; letter-spacing: -.01em; }
.tile .t-v small { font-size: 15px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.tile .t-d { font-size: 12px; color: var(--text-3); margin-top: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; min-width: 6px; }

/* Sleep */
.ringbox { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 4px; }
.ringbox svg { width: min(200px, 54vw); height: auto; }
.ringbox .q { font-weight: 600; font-size: 14px; }
.chip { font-size: 10px; font-weight: 700; letter-spacing: .14em; padding: 3px 9px; border-radius: 9px; background: var(--inset); color: var(--text-2); border: 1px solid var(--border); }
.nightnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nightnav h2 { margin: 2px 0 0; font-size: 19px; font-weight: 700; }
.range-chip { font-size: 12.5px; color: var(--text-2); padding: 6px 11px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
.times { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kv .k { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.kv .v { font-size: 20px; font-weight: 700; margin-top: 3px; }
.hyp { width: 100%; height: auto; display: block; margin-top: 6px; }
.stages { display: flex; flex-direction: column; gap: 11px; }
.stage-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
.stage-row .sw { display: flex; align-items: center; gap: 8px; }
.stage-row .sw i { width: 9px; height: 9px; border-radius: 3px; }
.stage-row .val { text-align: right; color: var(--text-2); white-space: nowrap; min-width: 96px; }
.stage-row .val b { color: var(--text); font-weight: 600; }

/* Trends */
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--inset); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.trend .tv { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 8px; }
.trend .tv b { font-size: 24px; font-weight: 700; }
.trend .tv span { font-size: 12.5px; color: var(--text-3); }
.trend svg { width: 100%; height: auto; display: block; }

/* Workouts */
.wlist { display: flex; flex-direction: column; }
.wrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.wrow:first-child { border-top: 0; padding-top: 2px; }
.wicon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--inset); color: var(--s100); }
.wicon svg { width: 19px; height: 19px; }
.wrow .wn { font-weight: 600; }
.wrow .wm { font-size: 12.5px; color: var(--text-3); margin-top: 2px; overflow-wrap: anywhere; }
.effort-chip { font-weight: 700; font-size: 15px; color: var(--s100); text-align: right; }
.effort-chip small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; color: var(--text-3); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

/* Lock */
.lock { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--canvas);
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); }
.lock form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; }
.lock h1 { margin: 6px 0 0; font-size: 24px; }
.lock p { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.45; }
.lock input[type=password] { height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 0 14px; font: inherit; font-size: 16px; }
.lock label { display: flex; gap: 8px; justify-content: center; align-items: center; font-size: 13px; color: var(--text-2); }
.btn { height: 46px; border-radius: 12px; border: 0; background: var(--mint); color: #0B1F19; font-weight: 700; font-size: 15px; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.empty { color: var(--text-3); font-size: 14px; padding: 6px 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .wrap { padding-block: 22px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;

    background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--border); }
  .tabbar .nav-item { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 2px; justify-content: center; align-items: center; }
  .tabbar .nav-item svg { width: 21px; height: 21px; }
  .tabbar .nav-item[aria-current="page"] { background: none; box-shadow: none; color: var(--mint); }
  .head h1 { font-size: 27px; }
  .times { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .src { right: 18px; }
}
@media (max-width: 420px) {
  .grid2 { gap: 10px; }
  .tile { padding: 12px 13px 14px; }
  .tile .t-v { font-size: 22px; }
  .stage-row { grid-template-columns: 62px 1fr auto; gap: 8px; font-size: 13px; }
  .stage-row .val { min-width: 0; }
}
@media (prefers-reduced-motion: no-preference) {

    </div>
    <div class="card"><div class="times">
      <div class="kv"><div class="k">Asleep</div><div class="v num">${fmtTime(n.startTs)}</div></div>
      <div class="kv"><div class="k">Woke</div><div class="v num">${fmtTime(n.endTs)}</div></div>
      <div class="kv"><div class="k">Time asleep</div><div class="v num">${fmtHM(asleep)}</div></div>
      <div class="kv"><div class="k">In bed</div><div class="v num">${fmtHM(inBed)}</div></div>
    </div>${n.stages?.length ? hypnogram(n) : ""}</div>
    <div class="card"><div class="card-h"><h2>Stages</h2><span class="over">${esc(navTitle)}</span></div><div class="stages">
      ${row("wake", "Awake", mins.wake)}${row("light", "Light", mins.light)}${row("deep", "Deep", mins.deep)}${row("rem", "REM", mins.rem)}</div></div>
    <div class="grid2">
      ${tile(I.moon, "Efficiency", "var(--rest)", n.efficiency == null ? null : Math.round(n.efficiency), "%", n.efficiency / 100, null, "Asleep ÷ in bed")}
      ${tile(I.wave, "Sleep HRV", "var(--steel)", n.avgHrv == null ? null : Math.round(n.avgHrv), "ms", n.avgHrv == null ? null : (n.avgHrv - 15) / 95, null, "")}
      ${tile(I.heart, "Sleep RHR", "var(--coral)", n.restingHr, "bpm", n.restingHr == null ? null : (n.restingHr - 38) / 44, null, "")}
      ${tile(I.info, "Disturbances", "var(--text-2)", d.disturbances, "", d.disturbances == null ? null : d.disturbances / 25, "var(--lav)", "")}
    </div>`;
}
function vTrends() {
  const all = S.data.days, days = all.slice(-S.range);
  const seg = `<div class="seg" role="group" aria-label="Range">${[7, 30, 90].map((r) => `<button data-range="${r}" aria-pressed="${S.range === r}">${r}D</button>`).join("")}</div>`;
  const card = (label, key, color, unit, opts = {}) => {
    const pts = days.map((d) => ({ day: d.day, v: opts.map ? opts.map(d[key]) : d[key] }));
    const vals = pts.map((p) => p.v).filter((v) => v != null);
    const lastV = vals.length ? vals[vals.length - 1] : null, a = avg(vals), dec = opts.dec ?? 0;
    const f = (v) => v == null ? "–" : (opts.fmt ? opts.fmt(v) : v.toFixed(dec));
    return `<div class="card trend"><div class="card-h"><h2>${esc(label)}</h2><span class="over">${S.range} days</span></div>
      <div class="tv"><b class="num">${f(lastV)}<small style="font-size:14px;color:var(--text-2);margin-left:3px">${esc(unit)}</small></b><span class="num">avg ${f(a)}${esc(unit)}</span></div>
      ${lineChart(pts, color, { ...opts, label })}</div>`;
  };
  return header("Trends", `${fmtDayShort(days[0].day)} – ${fmtDayShort(days[days.length - 1].day)}`, seg) + sampleBanner() + `
    ${card("Charge", "recovery", "var(--r100)", "%", { min: 0, max: 100, ticks: [25, 50, 75] })}
    ${card("Effort", "strain", "var(--s100)", "", { min: 0, max: 100, dec: 1, ticks: [25, 50, 75], tickDec: 0 })}
    ${card("Rest", "sleepPerf", "var(--rest)", "%", { min: 0, max: 100, ticks: [25, 50, 75] })}
    ${card("Heart rate variability", "avgHrv", "var(--steel)", " ms")}
    ${card("Resting heart rate", "restingHr", "var(--coral)", " bpm")}
    ${card("Time asleep", "totalSleepMin", "var(--st-light)", "", { map: (v) => v == null ? null : v / 60, dec: 1, fmt: (v) => fmtHM(v * 60), tickFmt: (t) => t.toFixed(1) + "h" })}
    ${card("Steps", "steps", "var(--r78)", "", { fmt: (v) => Math.round(v).toLocaleString(), tickFmt: (t) => (t / 1000).toFixed(1) + "k" })}`;
}
function vWorkouts() {
  const ws = S.data.workouts.slice().sort((a, b) => b.startTs - a.startTs);
  const cutoff = Date.now() / 1000 - 30 * 86400, recent = ws.filter((w) => w.startTs >= cutoff);
  const totalMin = recent.reduce((s, w) => s + (w.durationS || 0) / 60, 0), ae = avg(recent.map((w) => w.strain));
  const rows = ws.slice(0, 40).map((w) => `<div class="wrow"><div class="wicon">${I.workouts}</div>
      <div style="min-width:0"><div class="wn">${esc(w.sport)}</div>
      <div class="wm num">${esc(new Date(w.startTs * 1000).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }))} · ${fmtTime(w.startTs)} · ${fmtHM((w.durationS || 0) / 60)}${w.energyKcal ? ` · ${Math.round(w.energyKcal)} kcal` : ""}${w.avgHr ? ` · ${w.avgHr} bpm avg` : ""}${w.distanceM ? ` · ${(w.distanceM / 1609.34).toFixed(1)} mi` : ""}</div></div>
      <div class="effort-chip num">${w.strain == null ? "–" : w.strain.toFixed(1)}<small>EFFORT</small></div></div>`).join("");
  return header("Workouts", "Most recent first") + sampleBanner() + `
    <div class="card"><div class="stats3">
      <div class="kv"><div class="k">Last 30 days</div><div class="v num">${recent.length}</div></div>
      <div class="kv"><div class="k">Total time</div><div class="v num">${fmtHM(totalMin)}</div></div>
      <div class="kv"><div class="k">Avg effort</div><div class="v num">${ae == null ? "–" : ae.toFixed(1)}</div></div>
    </div></div>
    <div class="card">${rows ? `<div class="wlist">${rows}</div>` : `<div class="empty">No workouts yet.</div>`}</div>`;
}

/* ---------- Router ---------- */
const VIEWS = { today: vToday, sleep: vSleep, trends: vTrends, workouts: vWorkouts };
function route() { const h = location.hash.replace("#", ""); return VIEWS[h] ? h : "today"; }
function renderNav() {
  const r = route();
  const html = NAV.map(([k, lab]) => `<a class="nav-item" href="#${k}" ${k === r ? 'aria-current="page"' : ""}>${I[k]}<span>${lab}</span></a>`).join("");
  $("#side-nav").innerHTML = html; $("#tab-nav").innerHTML = html;
}
function renderStatus() {
  const el = $("#status"), ts = S.data?.lastSampleTs;
  const stale = !ts || Date.now() / 1000 - ts > 6 * 3600;
  el.classList.toggle("stale", stale);
  $("#status-t").textContent = S.sample ? "Sample data" : ts ? `Synced ${ago(ts)}` : "Never synced";
  const via = S.data?.sources?.[0]?.name; const viaTxt = via === "iphone-backup" ? "via iPhone" : via === "mac" ? "via Mac" : "";
  $("#status-s").textContent = [viaTxt, S.data?.battery?.soc != null ? `Battery ${Math.round(S.data.battery.soc)}%` : ""].filter(Boolean).join(" · ");
}
function render() {
  if (!S.data) return;
  renderNav(); renderStatus();
  $("#view").innerHTML = VIEWS[route()]();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act],[data-go],[data-range]"); if (!b) return;
  if (b.dataset.go) { location.hash = b.dataset.go; return; }
  if (b.dataset.range) { S.range = Number(b.dataset.range); store.set("noop.range", S.range); render(); return; }
  const a = b.dataset.act;
  if (a === "day-prev") S.dayIdx--; if (a === "day-next") S.dayIdx++;
  if (a === "night-prev") S.nightIdx--; if (a === "night-next") S.nightIdx++;
  render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
let rz, lastNarrow = innerWidth < 600;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const n = innerWidth < 600; if (n !== lastNarrow) { lastNarrow = n; render(); } }, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- Data loading + decryption ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(payload, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function accept(data, sample) {
  const keepDay = S.data && S.dayIdx !== S.data.days.length - 1, keepNight = S.data && S.nightIdx !== S.data.nights.length - 1;
  S.data = { days: [], nights: [], workouts: [], ...data }; S.sample = sample;
  S.data.days.sort((a, b) => a.day.localeCompare(b.day)); S.data.nights.sort((a, b) => a.startTs - b.startTs);
  if (!keepDay) S.dayIdx = S.data.days.length - 1;
  if (!keepNight) S.nightIdx = S.data.nights.length - 1;
  render();
}
let pending = null;
async function load() {
  let payload = null;
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (r.ok && (r.headers.get("content-type") || "").includes("json")) payload = await r.json();
  } catch {}
  if (payload && Array.isArray(payload.days) && !payload.ct) { accept(payload, false); return; } // local dev server only
  if (!payload || !payload.ct) {
    if (!S.data || S.sample) { const el = document.getElementById("sample-data"); accept(JSON.parse(el.textContent), true); }
    return;
  }
  const saved = store.get("noop.pass");
  if (saved) {
    try { accept(await decrypt(payload, saved), false); $("#lock").hidden = true; return; }
    catch { store.del("noop.pass"); }
  }
  pending = payload; $("#lock").hidden = false; setTimeout(() => $("#pass").focus(), 50);
}
$("#lock-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pass = $("#pass").value; $("#lock-err").textContent = "";
  try {
    const data = await decrypt(pending, pass);
    if ($("#remember").checked) store.set("noop.pass", pass);
    $("#lock").hidden = true; $("#pass").value = ""; accept(data, false);
  } catch { $("#lock-err").textContent = "That passphrase didn't unlock the data. Check it and try again."; }
});
load();
setInterval(() => { if (document.visibilityState === "visible") load(); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
})();
</script>
